# Amethyst Configuration

# Modifier keys (mod1 and mod2 can be customized)
mod1:
  - option
  - control
  - command

mod2:
  - option
  - control
  - command
  - shift

# Layouts
layouts:
  - tall
  - fullscreen
  - 3column-left
  - floating

# Window settings
window-margins: true
window-margin-size: 8
window-resize-step: 5

# Focus behavior
mouse-follows-focus: false
focus-follows-mouse: false

# Floating applications (bundle identifiers)
floating:
  - com.apple.systempreferences
  - com.apple.ActivityMonitor

# Keyboard shortcuts
cycle-layout:
  mod: mod1
  key: t

shrink-main:
  mod: mod1
  key: '='

expand-main:
  mod: mod1
  key: '-'

increase-main:
  mod: mod1
  key: '.'

decrease-main:
  mod: mod1
  key: ','

focus-ccw:
  mod: mod1
  key: i

focus-cw:
  mod: mod1
  key: o

swap-cw:
  mod: mod1
  key: n

swap-main:
  mod: mod1
  key: enter

focus-screen-1:
  mod: mod1
  key: m

focus-screen-2:
  mod: mod1
  key: l

select-fullscreen-layout:
  mod: mod1
  key: f

select-wide-layout:
  mod: mod2
  key: s

throw-space-1:
  mod: mod2
  key: '1'

throw-space-2:
  mod: mod2
  key: '2'

throw-space-3:
  mod: mod2
  key: '3'

throw-space-4:
  mod: mod2
  key: '4'

throw-space-5:
  mod: mod2
  key: '5'

throw-space-6:
  mod: mod2
  key: '6'

throw-space-7:
  mod: mod2
  key: '7'

throw-space-8:
  mod: mod2
  key: '8'
